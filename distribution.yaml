name: project-agent
version: 1.0.0
description: "Base profile for MAESTRO project agents: Hindsight memory, no messaging credentials, no memories"
author: "p-sw"
license: "MIT"

# Checked against MAESTRO's shell and the profile's .env at install time.
env_requires:
  - name: HINDSIGHT_API_KEY
    description: "Hindsight API key (project memory bank)"
    required: true
  - name: HINDSIGHT_API_URL
    description: "Hindsight API URL"
    required: false
    default: "https://api.hindsight.vectorize.io"
  - name: TAVILY_API_KEY
    description: "Tavily API key for web search (optional; keyless access works with lower limits)"
    required: false

# SOUL.md and the memory files are written per project by MAESTRO, so a
# `hermes profile update` must never replace them.
distribution_owned:
  - distribution.yaml
